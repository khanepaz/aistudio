
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 18px 24px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 16px;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.tab {
    border: 0;
    background: #ddd;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.tab.active {
    background: #111;
    color: white;
}

.panel {
    display: none;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.panel.active {
    display: block;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    font-weight: bold;
}

select,
textarea,
input[type="file"],
input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button.action {
    margin-top: 12px;
    padding: 10px 18px;
    border: 0;
    border-radius: 8px;
    background: #111;
    color: white;
    cursor: pointer;
}

button.action:hover {
    opacity: .85;
}

button.secondary {
    background: #666;
}

button.danger {
    background: #b00020;
}

.status {
    margin-top: 12px;
    color: #555;
    white-space: pre-wrap;
}

.error {
    color: #b00020;
    white-space: pre-wrap;
}

.chat-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
}

.history {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    background: #fafafa;
    max-height: 600px;
    overflow-y: auto;
}

.history-header {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}

.history-header button {
    flex: 1;
    padding: 8px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}

.history-item {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    background: white;
    border: 1px solid #ddd;
}

.history-item.active {
    background: #111;
    color: white;
}

.history-item-title {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.history-item-delete {
    font-size: 12px;
    margin-top: 5px;
    opacity: .7;
}

.empty-history {
    color: #777;
    text-align: center;
    padding: 20px 5px;
}

.chat-box {
    height: 420px;
    overflow-y: auto;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fafafa;
}

.msg {
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.msg.user {
    background: #e5e5e5;
}

.msg.assistant {
    background: #dff0ff;
}

.chat-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.image-result img {
    max-width: 100%;
    margin-top: 16px;
    border-radius: 10px;
}

.preview {
    max-width: 100%;
    max-height: 400px;
    margin-top: 12px;
    border-radius: 10px;
}

.model {
    border: 1px solid #ddd;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    background: #fafafa;
}

.model-title {
    font-weight: bold;
}

.model-capabilities {
    margin-top: 5px;
    color: #555;
    font-size: 13px;
}

.image-model-box {
    padding: 10px;
    background: #f7f7f7;
    border-radius: 8px;
    margin-top: 10px;
}

.loading {
    opacity: .7;
}

@media (max-width: 800px) {
    .chat-layout {
        grid-template-columns: 1fr;
    }

    .history {
        max-height: 220px;
    }

    .chat-controls {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>AI Studio</h1>
</header>

<div class="container">

    <div class="tabs">

        <button
            class="tab active"
            data-tab="chat"
        >
            Chat
        </button>

        <button
            class="tab"
            data-tab="image"
        >
            Image Generation
        </button>

        <button
            class="tab"
            data-tab="edit"
        >
            Image Edit
        </button>

        <button
            class="tab"
            data-tab="models"
        >
            Models
        </button>

    </div>


    <section
        id="chat"
        class="panel active"
    >

        <div class="chat-layout">

            <aside class="history">

                <div class="history-header">

                    <button
                        onclick="newChat()"
                    >
                        New
                    </button>

                    <button
                        class="secondary"
                        onclick="deleteAllChats()"
                    >
                        Clear
                    </button>

                </div>

                <div id="historyList"></div>

            </aside>


            <main>

                <label for="provider">
                    Provider
                </label>

                <select id="provider">

                    <option value="all">
                        All
                    </option>

                    <option value="OpenAI">
                        OpenAI
                    </option>

                    <option value="Anthropic">
                        Anthropic
                    </option>

                    <option value="xAI">
                        xAI
                    </option>

                    <option value="Google">
                        Google
                    </option>

                    <option value="DeepSeek">
                        DeepSeek
                    </option>

                    <option value="Alibaba">
                        Alibaba
                    </option>

                    <option value="Moonshot AI">
                        Moonshot AI
                    </option>

                    <option value="Zhipu AI">
                        Zhipu AI
                    </option>

                    <option value="MiniMax">
                        MiniMax
                    </option>

                </select>


                <label for="chatModel">
                    Model
                </label>

                <select id="chatModel">
                    <option value="gpt-6-astra">
                        gpt-6-astra
                    </option>
                </select>


                <div
                    id="chatBox"
                    class="chat-box"
                ></div>


                <textarea
                    id="chatInput"
                    placeholder="Type your message..."
                ></textarea>


                <div class="chat-controls">

                    <button
                        class="action"
                        onclick="sendMessage()"
                    >
                        Send
                    </button>

                    <button
                        class="action secondary"
                        onclick="clearCurrentChat()"
                    >
                        Clear Chat
                    </button>

                </div>


                <div
                    id="chatStatus"
                    class="status"
                ></div>

            </main>

        </div>

    </section>


    <section
        id="image"
        class="panel"
    >

        <h2>
            Image Generation
        </h2>


        <label for="imageModel">
            Image Model
        </label>

        <select id="imageModel">
            <option value="">
                Loading image models...
            </option>
        </select>


        <div
            id="imageModelInfo"
            class="image-model-box"
        ></div>


        <label for="imagePrompt">
            Prompt
        </label>

        <textarea
            id="imagePrompt"
            placeholder="Describe the image you want to generate..."
        ></textarea>


        <label for="imageSize">
            Size
        </label>

        <select id="imageSize">

            <option value="1024x1024">
                1024x1024
            </option>

            <option value="1792x1024">
                1792x1024
            </option>

            <option value="1024x1792">
                1024x1792
            </option>

        </select>


        <label for="imageQuality">
            Quality
        </label>

        <select id="imageQuality">

            <option value="standard">
                standard
            </option>

            <option value="hd">
                hd
            </option>

        </select>


        <button
            class="action"
            onclick="generateImage()"
        >
            Generate Image
        </button>


        <div
            id="imageStatus"
            class="status"
        ></div>


        <div
            id="imageResult"
            class="image-result"
        ></div>

    </section>


    <section
        id="edit"
        class="panel"
    >

        <h2>
            Image Edit
        </h2>


        <label for="editModel">
            Image Model
        </label>

        <select id="editModel">
            <option value="">
                Loading image models...
            </option>
        </select>


        <div
            id="editModelInfo"
            class="image-model-box"
        ></div>


        <label for="editFile">
            Image
        </label>

        <input
            id="editFile"
            type="file"
            accept="image/*"
            onchange="previewEditImage()"
        >


        <img
            id="editPreview"
            class="preview"
            hidden
            alt="Preview"
        >


        <label for="editPrompt">
            Edit Prompt
        </label>

        <textarea
            id="editPrompt"
            placeholder="Describe how you want to edit the image..."
        ></textarea>


        <button
            class="action"
            onclick="editImage()"
        >
            Edit Image
        </button>


        <div
            id="editStatus"
            class="status"
        ></div>


        <div
            id="editResult"
            class="image-result"
        ></div>

    </section>


    <section
        id="models"
        class="panel"
    >

        <button
            class="action"
            onclick="loadModels()"
        >
            Load Models
        </button>


        <div
            id="modelStatus"
            class="status"
        ></div>


        <div id="modelList"></div>

    </section>

</div>


<script>

const API =
    "https://myhamed.netlify.app/.netlify/functions/ai";


let allModels = [];

let imageModels = [];

let chats = [];

let currentChatId = null;

let messages = [];


const STORAGE_KEY =
    "ai_studio_chats_v1";


document
    .querySelectorAll(".tab")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".tab")
                    .forEach(item =>
                        item.classList.remove(
                            "active"
                        )
                    );

                document
                    .querySelectorAll(".panel")
                    .forEach(item =>
                        item.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                document
                    .getElementById(
                        button.dataset.tab
                    )
                    .classList.add(
                        "active"
                    );

            }
        );

    });


async function api(
    action,
    payload = {}
) {
    const response =
        await fetch(
            API,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        action,
                        payload
                    })
            }
        );

    const text =
        await response.text();

    let data;

    try {
        data =
            JSON.parse(text);
    } catch {
        throw new Error(
            text ||
            `HTTP ${response.status}`
        );
    }

    if (!response.ok) {
        throw new Error(
            extractError(data)
        );
    }

    return data;
}


function extractError(data) {
    if (
        typeof data?.error ===
        "string"
    ) {
        return data.error;
    }

    if (data?.error?.message) {
        return data.error.message;
    }

    if (data?.message) {
        return typeof data.message ===
            "string"
            ? data.message
            : JSON.stringify(
                data.message,
                null,
                2
            );
    }

    return JSON.stringify(
        data,
        null,
        2
    );
}


function createChatId() {
    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );
}


function loadChats() {
    try {
        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        chats =
            saved
                ? JSON.parse(saved)
                : [];

    } catch {
        chats = [];
    }

    if (!Array.isArray(chats)) {
        chats = [];
    }

    renderHistory();

    if (chats.length > 0) {
        openChat(
            chats[0].id
        );
    } else {
        newChat();
    }
}


function saveChats() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );
}


function newChat() {
    const chat = {
        id: createChatId(),
        title: "New Chat",
        model:
            document.getElementById(
                "chatModel"
            )?.value ||
            "gpt-6-astra",
        messages: [],
        createdAt: Date.now(),
        updatedAt: Date.now()
    };

    chats.unshift(chat);

    currentChatId =
        chat.id;

    messages =
        chat.messages;

    saveChats();

    renderHistory();

    renderMessages();

    document.getElementById(
        "chatStatus"
    ).textContent = "";
}


function openChat(id) {
    const chat =
        chats.find(
            item =>
                item.id === id
        );

    if (!chat) {
        return;
    }

    currentChatId =
        chat.id;

    messages =
        Array.isArray(
            chat.messages
        )
            ? chat.messages
            : [];

    const model =
        document.getElementById(
            "chatModel"
        );

    if (
        model &&
        chat.model
    ) {
        model.value =
            chat.model;
    }

    renderHistory();

    renderMessages();
}


function saveCurrentChat() {
    const chat =
        chats.find(
            item =>
                item.id ===
                currentChatId
        );

    if (!chat) {
        return;
    }

    chat.messages =
        messages;

    chat.model =
        document.getElementById(
            "chatModel"
        ).value;

    chat.updatedAt =
        Date.now();

    const firstUserMessage =
        messages.find(
            item =>
                item.role ===
                "user"
        );

    if (
        firstUserMessage &&
        chat.title ===
            "New Chat"
    ) {
        chat.title =
            firstUserMessage.content
                .replace(
                    /\s+/g,
                    " "
                )
                .trim()
                .substring(
                    0,
                    40
                );
    }

    chats.sort(
        (a, b) =>
            b.updatedAt -
            a.updatedAt
    );

    saveChats();

    renderHistory();
}


function renderHistory() {
    const list =
        document.getElementById(
            "historyList"
        );

    if (!chats.length) {
        list.innerHTML =
            '<div class="empty-history">No chats yet.</div>';

        return;
    }

    list.innerHTML =
        chats.map(chat => {

            const active =
                chat.id ===
                currentChatId
                    ? "active"
                    : "";

            return `
                <div
                    class="history-item ${active}"
                    onclick="openChat('${chat.id}')"
                >
                    <div class="history-item-title">
                        ${esc(chat.title)}
                    </div>

                    <div class="history-item-delete">
                        ${chat.messages.length}
                        messages
                    </div>
                </div>
            `;

        }).join("");
}


function renderMessages() {
    const box =
        document.getElementById(
            "chatBox"
        );

    box.innerHTML = "";

    messages.forEach(
        message => {

            addMsg(
                message.role,
                message.content
            );

        }
    );
}


function deleteAllChats() {
    if (!chats.length) {
        return;
    }

    if (
        !confirm(
            "Delete all chat history?"
        )
    ) {
        return;
    }

    chats = [];

    currentChatId =
        null;

    messages = [];

    saveChats();

    newChat();
}


function clearCurrentChat() {
    messages = [];

    const chat =
        chats.find(
            item =>
                item.id ===
                currentChatId
        );

    if (chat) {
        chat.messages = [];
        chat.title =
            "New Chat";
        chat.updatedAt =
            Date.now();
    }

    saveChats();

    renderHistory();

    renderMessages();
}


document
    .getElementById("provider")
    .addEventListener(
        "change",
        refreshModels
    );


function refreshModels() {
    const provider =
        document.getElementById(
            "provider"
        ).value;

    const list =
        allModels.filter(
            model =>
                provider ===
                    "all" ||
                model.company ===
                    provider
        );

    const select =
        document.getElementById(
            "chatModel"
        );

    const current =
        select.value;

    select.innerHTML =
        list.map(
            model =>
                `<option value="${esc(model.id)}">${esc(model.id)}</option>`
        ).join("");

    if (
        [...select.options]
            .some(
                option =>
                    option.value ===
                    current
            )
    ) {
        select.value =
            current;
    }

    if (!list.length) {
        select.innerHTML =
            '<option value="gpt-6-astra">gpt-6-astra</option>';
    }
}


async function sendMessage() {
    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    if (!currentChatId) {
        newChat();
    }

    const model =
        document.getElementById(
            "chatModel"
        ).value;

    addMsg(
        "user",
        text
    );

    input.value = "";

    messages.push({
        role: "user",
        content: text
    });

    saveCurrentChat();

    const status =
        document.getElementById(
            "chatStatus"
        );

    status.textContent =
        "Generating...";

    try {
        const data =
            await api(
                "chat",
                {
                    model,
                    messages
                }
            );

        const answer =
            data.choices?.[0]
                ?.message?.content ||
            "No response.";

        addMsg(
            "assistant",
            answer
        );

        messages.push({
            role: "assistant",
            content: answer
        });

        saveCurrentChat();

        status.textContent =
            "Done.";

    } catch (error) {

        addMsg(
            "assistant",
            "Error: " +
                error.message
        );

        status.textContent =
            "Failed.";
    }
}


function addMsg(
    role,
    text
) {
    const div =
        document.createElement(
            "div"
        );

    div.className =
        "msg " + role;

    div.textContent =
        text;

    const box =
        document.getElementById(
            "chatBox"
        );

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;
}


/*
 * Load image-capable models.
 */
async function loadImageModels() {

    const imageSelect =
        document.getElementById(
            "imageModel"
        );

    const editSelect =
        document.getElementById(
            "editModel"
        );

    imageSelect.innerHTML =
        "<option>Loading...</option>";

    editSelect.innerHTML =
        "<option>Loading...</option>";

    try {

        const data =
            await api(
                "imageModels"
            );

        imageModels =
            Array.isArray(
                data.data
            )
                ? data.data
                : [];

        if (!imageModels.length) {

            imageSelect.innerHTML =
                '<option value="">No image models detected</option>';

            editSelect.innerHTML =
                '<option value="">No image models detected</option>';

            return;
        }

        renderImageModelSelects();

    } catch (error) {

        const message =
            "Failed to load image models: " +
            error.message;

        imageSelect.innerHTML =
            `<option value="">${esc(message)}</option>`;

        editSelect.innerHTML =
            `<option value="">${esc(message)}</option>`;
    }
}


function renderImageModelSelects() {

    const imageSelect =
        document.getElementById(
            "imageModel"
        );

    const editSelect =
        document.getElementById(
            "editModel"
        );

    imageSelect.innerHTML =
        imageModels
            .map(model =>
                `<option value="${esc(model.id)}">${esc(model.id)}${model.company ? " — " + esc(model.company) : ""}</option>`
            )
            .join("");

    const editableModels =
        imageModels.filter(
            model =>
                model.supports_edit
        );

    editSelect.innerHTML =
        (
            editableModels.length
                ? editableModels
                : imageModels
        )
            .map(model =>
                `<option value="${esc(model.id)}">${esc(model.id)}${model.company ? " — " + esc(model.company) : ""}</option>`
            )
            .join("");

    updateImageModelInfo();

    updateEditModelInfo();
}


function updateImageModelInfo() {

    const modelId =
        document.getElementById(
            "imageModel"
        ).value;

    const model =
        imageModels.find(
            item =>
                item.id ===
                modelId
        );

    const box =
        document.getElementById(
            "imageModelInfo"
        );

    if (!model) {
        box.textContent = "";
        return;
    }

    box.textContent =
        "Provider: " +
        (model.company ||
            "Unknown") +
        " | Generation: supported" +
        (model.supports_edit
            ? " | Edit: supported"
            : "");
}


function updateEditModelInfo() {

    const modelId =
        document.getElementById(
            "editModel"
        ).value;

    const model =
        imageModels.find(
            item =>
                item.id ===
                modelId
        );

    const box =
        document.getElementById(
            "editModelInfo"
        );

    if (!model) {
        box.textContent = "";
        return;
    }

    box.textContent =
        "Provider: " +
        (model.company ||
            "Unknown") +
        " | Edit: " +
        (
            model.supports_edit
                ? "supported"
                : "not confirmed"
        );
}


document
    .getElementById(
        "imageModel"
    )
    .addEventListener(
        "change",
        updateImageModelInfo
    );


document
    .getElementById(
        "editModel"
    )
    .addEventListener(
        "change",
        updateEditModelInfo
    );


async function generateImage() {

    const model =
        document.getElementById(
            "imageModel"
        ).value;

    const prompt =
        document.getElementById(
            "imagePrompt"
        ).value.trim();

    if (!model) {
        showStatus(
            "imageStatus",
            "No image model selected."
        );
        return;
    }

    if (!prompt) {
        showStatus(
            "imageStatus",
            "Please enter a prompt."
        );
        return;
    }

    const status =
        document.getElementById(
            "imageStatus"
        );

    const output =
        document.getElementById(
            "imageResult"
        );

    status.textContent =
        "Generating...";

    output.innerHTML = "";

    try {

        const data =
            await api(
                "image",
                {
                    model,
                    prompt,
                    n: 1,
                    size:
                        document.getElementById(
                            "imageSize"
                        ).value,
                    quality:
                        document.getElementById(
                            "imageQuality"
                        ).value,
                    response_format:
                        "b64_json"
                }
            );

        const item =
            data.data?.[0];

        if (item?.url) {

            output.innerHTML =
                `<img src="${esc(item.url)}" alt="Generated image">`;

        } else if (
            item?.b64_json
        ) {

            output.innerHTML =
                `<img src="data:image/png;base64,${item.b64_json}" alt="Generated image">`;

        } else {

            throw new Error(
                "No image returned."
            );
        }

        status.textContent =
            "Done.";

    } catch (error) {

        status.innerHTML =
            `<div class="error">${esc(error.message)}</div>`;
    }
}


function previewEditImage() {

    const file =
        document.getElementById(
            "editFile"
        ).files[0];

    const image =
        document.getElementById(
            "editPreview"
        );

    if (!file) {
        image.hidden =
            true;
        return;
    }

    image.src =
        URL.createObjectURL(
            file
        );

    image.hidden =
        false;
}


async function editImage() {

    const model =
        document.getElementById(
            "editModel"
        ).value;

    const file =
        document.getElementById(
            "editFile"
        ).files[0];

    const prompt =
        document.getElementById(
            "editPrompt"
        ).value.trim();

    if (!model) {
        showStatus(
            "editStatus",
            "No image model selected."
        );
        return;
    }

    if (!file) {
        showStatus(
            "editStatus",
            "Please select an image."
        );
        return;
    }

    if (!prompt) {
        showStatus(
            "editStatus",
            "Please enter an edit prompt."
        );
        return;
    }

    const status =
        document.getElementById(
            "editStatus"
        );

    const output =
        document.getElementById(
            "editResult"
        );

    status.textContent =
        "Editing...";

    output.innerHTML = "";

    try {

        const formData =
            new FormData();

        formData.append(
            "image",
            file,
            file.name
        );

        formData.append(
            "prompt",
            prompt
        );

        formData.append(
            "model",
            model
        );

        const response =
            await fetch(
                API,
                {
                    method: "POST",
                    body: formData
                }
            );

        const text =
            await response.text();

        let data;

        try {
            data =
                JSON.parse(text);
        } catch {
            throw new Error(
                text ||
                `HTTP ${response.status}`
            );
        }

        if (!response.ok) {
            throw new Error(
                extractError(data)
            );
        }

        const item =
            data.data?.[0];

        if (item?.url) {

            output.innerHTML =
                `<img src="${esc(item.url)}" alt="Edited image">`;

        } else if (
            item?.b64_json
        ) {

            output.innerHTML =
                `<img src="data:image/png;base64,${item.b64_json}" alt="Edited image">`;

        } else {

            throw new Error(
                "No edited image returned."
            );
        }

        status.textContent =
            "Done.";

    } catch (error) {

        status.innerHTML =
            `<div class="error">${esc(error.message)}</div>`;
    }
}


async function loadModels() {

    const status =
        document.getElementById(
            "modelStatus"
        );

    const list =
        document.getElementById(
            "modelList"
        );

    status.textContent =
        "Loading...";

    list.innerHTML = "";

    try {

        const data =
            await api(
                "models"
            );

        allModels =
            data.data || [];

        refreshModels();

        list.innerHTML =
            allModels.map(
                model => {

                    const capabilities = [];

                    if (
                        model.supports_vision
                    ) {
                        capabilities.push(
                            "vision"
                        );
                    }

                    if (
                        model.supports_reasoning
                    ) {
                        capabilities.push(
                            "reasoning"
                        );
                    }

                    if (
                        model.supports_tools
                    ) {
                        capabilities.push(
                            "tools"
                        );
                    }

                    if (
                        isLikelyImageModel(
                            model
                        )
                    ) {
                        capabilities.push(
                            "image"
                        );
                    }

                    return `
                        <div class="model">

                            <div class="model-title">
                                ${esc(model.id)}
                            </div>

                            <div>
                                ${esc(
                                    model.company ||
                                    model.provider ||
                                    ""
                                )}
                            </div>

                            <div class="model-capabilities">
                                ${esc(
                                    capabilities.join(
                                        " · "
                                    )
                                )}
                            </div>

                        </div>
                    `;
                }
            ).join("");

        status.textContent =
            `${allModels.length} models loaded.`;

    } catch (error) {

        status.textContent =
            "Error: " +
            error.message;
    }
}


function isLikelyImageModel(
    model
) {
    const id =
        String(
            model.id || ""
        ).toLowerCase();

    const text =
        JSON.stringify(
            model
        ).toLowerCase();

    if (
        text.includes(
            "image_generation"
        ) ||
        text.includes(
            "image-generation"
        ) ||
        text.includes(
            "text-to-image"
        )
    ) {
        return true;
    }

    const patterns = [
        "grok-imagine",
        "gpt-image",
        "dall-e",
        "nano-banana",
        "gemini-image",
        "seedream",
        "flux",
        "qwen-image",
        "firefly",
        "midjourney",
        "stable-diffusion",
        "sdxl",
        "ideogram",
        "imagen"
    ];

    return patterns.some(
        pattern =>
            id.includes(pattern)
    );
}


function showStatus(
    id,
    message
) {
    const element =
        document.getElementById(
            id
        );

    element.textContent =
        message;
}


function esc(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ??
        "";

    return div.innerHTML;
}


loadChats();

loadModels();

loadImageModels();

</script>
